services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sprintly
      POSTGRES_PASSWORD: sprintly
      POSTGRES_DB: sprintly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sprintly_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintly"]
      interval: 5s
      retries: 10
volumes:
  sprintly_data:
