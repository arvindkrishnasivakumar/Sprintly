name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sprintly
          POSTGRES_PASSWORD: sprintly
          POSTGRES_DB: sprintly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sprintly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sprintly:sprintly@localhost:5432/sprintly
      AUTH_SECRET: ci-only-secret-not-for-production-123456789
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
